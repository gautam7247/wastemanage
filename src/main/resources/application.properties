spring.application.name=WasteMange
server.port=8080

# ===================================================================
# Database Configuration (MySQL 8 with Flyway)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/reloop_db
spring.datasource.username=root
spring.datasource.password=Gautam@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c5d8e0a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Payment Gateway Sandbox Configuration
# ===================================================================
app.payment.provider=${PAYMENT_PROVIDER:SANDBOX}
app.payment.sandbox.api-key=${PAYMENT_API_KEY:reloop_sandbox_key_987654321}
app.payment.sandbox.api-secret=${PAYMENT_API_SECRET:reloop_sandbox_secret_abcdef123456}
app.payment.sandbox.webhook-secret=${PAYMENT_WEBHOOK_SECRET:reloop_webhook_secret_xyz789}

# ===================================================================
# Springdoc OpenAPI / Swagger UI Configuration
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
